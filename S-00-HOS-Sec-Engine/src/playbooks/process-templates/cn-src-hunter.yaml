# CN SRC 漏洞赏金方法论框架
# 本模板提供方法论指导，而非固定操作步骤
# AI 根据模板的阶段目标、思路指导和决策规则，动态决定执行策略
id: cn-src-hunter
name: CN SRC 漏洞赏金流水线
description: |
  国内 SRC 漏洞赏金方法论框架。
  从项目情报收集到漏洞提交的完整 7 阶段流水线，采用自适应决策树驱动。
  每个阶段提供目标、思路指导和成功标准，AI 根据实际回显动态调整执行策略。
category: web
version: 1.0.0

# ============================================================
# 阶段定义 — 方法论指导
# ============================================================
phases:
  # ==================== Phase 1: 合规红线 ====================
  - id: compliance-gate
    name: 合规红线检查
    description: |
      方法论指导：
      1. 确认研究人员身份和授权状态（实名认证、白名单权限、项目授权范围）
      2. 核实项目边界规则（允许的资产范围、禁止测试的资产、限制测试时间窗口）
      3. 检查行为准则（禁止的测试类型、数据处理要求、报告格式规范）
      4. 确认奖励规则和评级标准（漏洞分级、积分换算、现金奖励区间）
      5. 记录合规确认结果，作为后续所有测试的前置条件
      6. 如合规检查未通过，终止流水线并输出原因
    objectives:
      - 确认当前账号的有效授权状态
      - 明确项目的资产范围和禁止测试清单
      - 掌握行为准则和奖励规则
      - 输出合规检查报告作为后续阶段的准入凭证
    approach: |
      AI 应该：
      - 检查当前账号的认证状态和项目关联权限
      - 提取项目页面的资产范围描述和边界说明
      - 分析行为条款中的禁止行为和限制条件
      - 整理漏洞分级标准和对应奖励区间
      - 生成合规检查清单并标记风险点
      - 如果存在模糊地带，主动提示需要人工确认的内容
    successCriteria:
      - 已确认账号授权状态有效
      - 已提取完整的资产范围和禁止测试清单
      - 已掌握行为准则和奖励规则
      - 已输出合规检查报告并获得准入通过
    maxRetries: 1
    timeout: 120

  # ==================== Phase 2: 项目情报收集与评分 ====================
  - id: program-hunter
    name: 项目情报收集与评分
    description: |
      方法论指导：
      1. 从公开情报源收集目标项目的基础信息（业务类型、产品矩阵、技术栈线索）
      2. 汇总主流 SRC 平台上的项目数据（关注人数、历史漏洞量、响应速度、奖励活跃度）
      3. 分析项目历史漏洞的类型分布和严重程度趋势
      4. 评估项目的安全成熟度和可挖掘潜力
      5. 根据评分模型对项目进行优先级排序
      6. 输出项目画像和测试优先级建议
    objectives:
      - 建立目标项目的基础情报档案
      - 收集项目在各平台的公开数据
      - 分析历史漏洞特征和趋势
      - 完成项目优先级评分和排序
    approach: |
      AI 应该：
      - 从公开渠道收集项目的业务描述和产品信息
      - 汇总主流漏洞平台的项目页面数据（关注数、提交量、响应率）
      - 分析近 12 个月的漏洞公开记录，提取类型分布
      - 评估项目的安全投入程度和漏洞修复速度
      - 基于评分模型（活跃度 × 响应速度 × 奖励水平 × 历史漏洞密度）计算优先级
      - 输出项目画像卡片和测试优先级列表
    successCriteria:
      - 已建立至少 3 个候选项目的情报档案
      - 已完成所有候选项目的优先级评分
      - 已识别各项目的历史热点漏洞类型
      - 已输出推荐测试的项目排序列表
    maxRetries: 2
    timeout: 300

  # ==================== Phase 3: 资产发现 ====================
  - id: asset-discovery
    name: 资产发现与指纹识别
    description: |
      方法论指导：
      1. 基于项目范围，枚举目标域名的子域名和关联资产
      2. 对发现的资产进行存活检测，筛选可访问的在线服务
      3. 对存活资产进行技术指纹识别（Web 框架、中间件、后端语言、CDN 类型）
      4. 识别 API 端点、移动端接口和第三方集成
      5. 标记高价值资产（管理后台、API 网关、支付模块、用户中心）
      6. 输出资产清单和攻击面热力图
    objectives:
      - 完成目标域名的子域名枚举和关联资产收集
      - 识别所有存活的在线服务
      - 完成技术指纹识别和分类
      - 标记高价值攻击面
    approach: |
      AI 应该：
      - 基于主域名使用多重手段枚举子域名（被动收集 + 主动探测）
      - 对所有发现的资产进行 HTTP/HTTPS 存活检测
      - 收集存活资产的技术指纹（响应头、页面特征、JS 引用、Cookie 格式）
      - 识别 API 路径、移动端接口和 WebSocket 端点
      - 根据业务重要性标记资产价值等级
      - 生成资产清单表格和攻击面统计摘要
    successCriteria:
      - 已枚举至少 50 个子域名或关联资产
      - 已识别至少 20 个存活的在线服务
      - 已完成所有存活资产的技术指纹识别
      - 已输出高价值资产清单和攻击面统计
    maxRetries: 2
    timeout: 600

  # ==================== Phase 4: 漏洞扫描与挖掘 ====================
  - id: vulnerability-hunting
    name: 漏洞扫描与挖掘
    description: |
      方法论指导：
      1. 先采摘低垂果实：检测常见未授权访问、信息泄露、弱口令等易发现漏洞
      2. 针对高价值资产进行深度扫描：SQL 注入、XSS、SSRF、文件上传等
      3. 分析业务逻辑漏洞：越权访问、支付逻辑、会话管理、密码重置流程
      4. 测试 API 安全：鉴权缺失、参数篡改、重放攻击、批量请求滥用
      5. 挖掘存储型漏洞：存储型 XSS、模板注入、反序列化漏洞
      6. 根据回显动态调整测试方向，避免机械性重复扫描
    objectives:
      - 发现尽可能多的高价值漏洞
      - 覆盖所有高优先级资产的主要漏洞类型
      - 评估每个漏洞的严重程度和影响范围
      - 为发现的漏洞准备 PoC 验证路径
    approach: |
      AI 应该：
      - 优先扫描未授权访问和信息泄露等低垂果实
      - 对高价值资产进行 OWASP Top 10 全覆盖扫描
      - 深入分析业务逻辑流，寻找逻辑缺陷
      - 对 API 端点进行鉴权和参数篡改测试
      - 对所有发现的异常回显进行二次确认和深度探测
      - 根据漏洞类型和严重程度进行分类和排序
      - 根据实际回显动态调整扫描策略和深度
    successCriteria:
      - 已完成所有高优先级资产的漏洞扫描
      - 已发现至少 3 个有效漏洞或异常点
      - 已为每个漏洞准备初步的验证思路
      - 已输出漏洞列表并按严重程度排序
    maxRetries: 3
    timeout: 900

  # ==================== Phase 5: AI 验证 ====================
  - id: ai-verification
    name: AI 漏洞验证与去重
    description: |
      方法论指导：
      1. 对每个发现的漏洞进行独立复验，确认可稳定复现
      2. 检查漏洞是否在项目授权范围内（排除越权测试的漏洞）
      3. 与公开漏洞库比对，排除已修复或已披露的重复漏洞
      4. 评估漏洞的实际影响范围和严重程度
      5. 验证 PoC 的可执行性和危害展示效果
      6. 输出经验证的最终漏洞清单
    objectives:
      - 确认所有候选漏洞的可复现性
      - 排除越权和重复漏洞
      - 完成漏洞严重程度评估
      - 输出经验证的最终漏洞列表
    approach: |
      AI 应该：
      - 对每个候选漏洞执行 3 次独立复验，确认稳定性
      - 检查漏洞目标是否在项目授权范围内
      - 与公开漏洞库进行交叉比对，排除重复上报风险
      - 综合评估漏洞的 CVSS 评分和业务影响
      - 为每个通过验证的漏洞生成清晰的复现步骤
      - 标记需要人工进一步确认的边界情况
    successCriteria:
      - 已完成所有候选漏洞的独立复验
      - 已排除所有越权和重复漏洞
      - 已完成漏洞严重程度评估
      - 已输出经验证的漏洞清单
    maxRetries: 2
    timeout: 600

  # ==================== Phase 6: 报告生成 ====================
  - id: report-generation
    name: 报告生成与格式化
    description: |
      方法论指导：
      1. 根据各 SRC 平台的报告模板要求，格式化漏洞报告
      2. 报告内容应包含：漏洞标题、漏洞描述、影响范围、复现步骤、PoC 代码、修复建议
      3. 为每个漏洞选择合适的严重程度等级和奖励预估
      4. 生成清晰的漏洞截图和影响范围说明
      5. 检查报告格式是否符合目标平台的提交规范
      6. 输出可直接提交的标准化报告
    objectives:
      - 为每个经验证的漏洞生成标准化报告
      - 确保报告内容完整、准确、可复现
      - 匹配目标平台的报告格式要求
      - 准备漏洞截图和辅助材料
    approach: |
      AI 应该：
      - 根据目标平台的模板要求组织报告结构
      - 为每个漏洞编写清晰的标题和描述
      - 整理复现步骤为编号序列，确保可复现
      - 生成 PoC 代码或请求示例
      - 撰写修复建议和安全加固方案
      - 选择合适的严重程度等级
      - 检查报告格式和字数是否符合平台规范
    successCriteria:
      - 已为所有经验证的漏洞生成完整报告
      - 报告格式符合目标平台要求
      - 所有报告包含可执行的复现步骤
      - 已准备好截图和辅助材料
    maxRetries: 1
    timeout: 300

  # ==================== Phase 7: 提交 ====================
  - id: submission
    name: 漏洞提交与跟踪
    description: |
      方法论指导：
      1. 人工复核所有报告内容，确认无误后进行提交
      2. 按照平台流程逐个提交漏洞报告
      3. 记录提交状态、提交时间和平台受理编号
      4. 设置跟踪提醒，定期检查平台处理进度
      5. 根据平台反馈补充信息或回应质疑
      6. 归档所有提交记录和处理结果
    objectives:
      - 完成所有漏洞报告的平台提交
      - 记录提交状态和受理编号
      - 设置处理进度跟踪
      - 归档提交记录
    approach: |
      AI 应该：
      - 列出所有待提交的漏洞报告清单
      - 按照优先级排序提交顺序
      - 记录每个报告的提交时间和受理编号
      - 生成提交跟踪表格
      - 标记需要后续跟进的报告
      - 输出提交完成总结报告
    successCriteria:
      - 已完成所有漏洞报告的提交
      - 已记录所有受理编号和提交时间
      - 已生成提交跟踪表格
      - 已输出提交完成总结
    maxRetries: 2
    timeout: 300

# ============================================================
# 自适应决策树
# 根据每个阶段的执行结果动态决定下一步
# ============================================================
decisionTree:
  - id: decide-after-compliance
    sourcePhase: compliance-gate
    conditions:
      - rule: "合规检查通过"
        nextPhase: program-hunter
        description: "合规检查通过，进入项目情报收集阶段"
      - rule: "合规检查未通过"
        nextPhase: null
        description: "合规检查未通过，流程终止"
    defaultNext: null

  - id: decide-after-program
    sourcePhase: program-hunter
    conditions:
      - rule: "已完成项目评分与排序"
        nextPhase: asset-discovery
        description: "项目已选定，进入资产发现阶段"
      - rule: "候选项目不足"
        nextPhase: null
        description: "候选项目不足，流程终止"
    defaultNext: asset-discovery

  - id: decide-after-asset
    sourcePhase: asset-discovery
    conditions:
      - rule: "已完成资产发现与指纹识别"
        nextPhase: vulnerability-hunting
        description: "资产清单就绪，进入漏洞扫描与挖掘阶段"
      - rule: "未发现存活资产"
        nextPhase: null
        description: "未发现存活资产，流程终止"
    defaultNext: vulnerability-hunting

  - id: decide-after-hunting
    sourcePhase: vulnerability-hunting
    conditions:
      - rule: "发现有效漏洞"
        nextPhase: ai-verification
        description: "漏洞扫描完成，进入 AI 验证阶段"
      - rule: "未发现有效漏洞"
        nextPhase: null
        description: "未发现有效漏洞，流程终止"
    defaultNext: ai-verification

  - id: decide-after-verification
    sourcePhase: ai-verification
    conditions:
      - rule: "经验证的漏洞清单非空"
        nextPhase: report-generation
        description: "漏洞验证通过，进入报告生成阶段"
      - rule: "所有漏洞验证未通过"
        nextPhase: null
        description: "所有漏洞验证未通过，流程终止"
    defaultNext: report-generation

  - id: decide-after-report
    sourcePhase: report-generation
    conditions:
      - rule: "报告生成完成"
        nextPhase: submission
        description: "报告就绪，进入提交阶段"
      - rule: "报告生成失败"
        nextPhase: null
        description: "报告生成失败，流程终止"
    defaultNext: submission

  - id: decide-after-submission
    sourcePhase: submission
    conditions:
      - rule: "所有报告提交成功"
        nextPhase: null
        description: "所有报告提交成功，流程结束"
      - rule: "部分报告提交失败"
        nextPhase: null
        description: "部分报告提交失败，流程结束并生成失败清单"
    defaultNext: null