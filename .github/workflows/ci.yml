name: CI - HOS Skill Workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # YAML 语法校验
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint workflow YAML files
        run: |
          echo "Checking workflow YAML syntax..."
          find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) | while read file; do
            echo "Checking $file"
            yamllint -d "{extends: relaxed, rules: {line-length: disable}}" "$file" || exit 1
          done
          echo "✓ All workflow YAML files are valid"

      - name: Lint other YAML files (warning only)
        run: |
          echo "Checking other YAML files (warnings only)..."
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/.github/workflows/*" | while read file; do
            echo "Checking $file"
            yamllint -d "{extends: relaxed, rules: {line-length: disable}}" "$file" || echo "Warning: $file has issues"
          done
          echo "✓ Other YAML files check completed (warnings ignored)"
        continue-on-error: true

  # 多语言模块检测与构建
  build-modules:
    name: Build Modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - 00-HOS-Sec-Engine
          - 04-HOS-Silly-Mock
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.module }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping"
            exit 0
          fi

      - name: Lint with ESLint
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f .eslintrc* ] || grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint || npx eslint . --ext .js,.jsx,.ts,.tsx
          else
            echo "No ESLint configuration found, skipping"
          fi
        continue-on-error: true

      - name: Type check with TypeScript
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No TypeScript configuration found, skipping"
          fi
        continue-on-error: true

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: |
          if grep -q '"test"' package.json 2>/dev/null; then
            npm test
          else
            echo "No test script found in package.json, skipping"
          fi
        continue-on-error: true

      - name: Build
        working-directory: ${{ matrix.module }}
        run: |
          if grep -q '"build"' package.json 2>/dev/null; then
            npm run build
          else
            echo "No build script found in package.json, skipping"
          fi
        continue-on-error: true

  # Python 模块测试
  test-python-modules:
    name: Test Python Modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - 13-HOS-AI-Guardrail
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping"
            exit 0
          fi

      - name: Run tests with pytest
        working-directory: ${{ matrix.module }}
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v || echo "Tests failed but continuing"
          else
            echo "No tests directory found, skipping"
          fi
        continue-on-error: true

  # Shell 脚本语法检查
  lint-shell-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "Checking shell script syntax..."
          find . -type f -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.git/*" | while read file; do
            echo "Checking $file"
            shellcheck "$file" || echo "Warning: $file has issues"
          done
          echo "✓ Shell script check completed"
        continue-on-error: true

  # 文档模块验证
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

  # 集成测试
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [yaml-lint, build-modules, test-python-modules]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify module structure
        run: |
          echo "Verifying module structure..."
          for dir in */; do
            if [ -f "${dir}SKILL.md" ] || [ -f "${dir}README.md" ]; then
              echo "✓ ${dir} has documentation"
            else
              echo "⚠ ${dir} missing documentation"
            fi
          done

      - name: Test skill loading
        run: |
          echo "Testing skill loading capability..."
          find . -name "SKILL.md" -type f | head -5 | while read skill; do
            echo "Found skill: $skill"
          done
