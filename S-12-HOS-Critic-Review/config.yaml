# HOS-CRITIC-REVIEW 配置
# 用户一句话可覆盖以下默认值（如「正经点」→ spiciness 0）

# 输出模式：quick | expert | academic
output_mode: quick

# 输出格式：md | html | pdf（默认 html——报告以美观单文件网页交付，零额外 LLM token）
output_format: html

# 毒舌辣度 0-5（默认 3）
spiciness: 3

# 六维权重（合计应为 1.00；可按对象类型覆盖，见 weights_by_type）
weights:
  technical: 0.20
  innovation: 0.20
  engineering: 0.15
  ecosystem: 0.15
  risk: 0.15
  strategic: 0.15

# 对象类型覆盖示例（paper 提高创新权重）
weights_by_type:
  paper:
    technical: 0.15
    innovation: 0.25
    engineering: 0.15
    ecosystem: 0.10
    risk: 0.15
    strategic: 0.20

# 切片阈值（与 chunk-engine/ 一致）
chunking:
  unit_max_tokens: 4000
  fallback_chunk_size: 1500
  fallback_overlap: 150
  coverage_threshold: 0.95
  sample_target_tokens: 200000

# 评分基准与扣分
scoring:
  baseline: 7.0
  no_finding_baseline: { technical: 8, innovation: 7, engineering: 8, ecosystem: 7, risk: 7, strategic: 7 }
  severity_penalty: { CRITICAL: 2.0, HIGH: 1.5, MEDIUM: 1.0, LOW: 0.5, INFO: 0.0 }
  evidence_factor: { verified: 1.0, partial: 0.7, low_confidence: 0.5, refuted: 0.0 }

# 降级开关（全部默认允许；--no-network 强制关闭网络能力）
degradation:
  allow_tool_degradation: true
  allow_network: true
  cache_ttl_seconds: 3600

# 联网核验（Evidence-Agent 强制项）
# paper/repo 对象必须核验 arXiv 元数据、GitHub 仓库、DOI/Zenodo 等官方来源；
# 网络不可用属降级而非默认路径——禁止未尝试联网就直接标 unverifiable（降级不撒谎）。
evidence_network:
  required: true
  # 校验源优先级：官方页面/API 优先，其次聚合索引，最后宿主已知事实
  sources:
    - arxiv_abs        # https://arxiv.org/abs/<id>：标题/版本/发表状态/代码链接
    - github_api       # https://api.github.com/repos/<owner>/<repo>
    - doi_zenodo       # https://doi.org/<doi> / zenodo.org 记录
    - semantic_scholar # 引用量/venue 交叉核验
  # 判定基准：尝试过官方源仍无结果 → 写「查不到，证据缺口」；未尝试 → 视为流程缺陷
  unverifiable_rule: "must_have_tried"

# 上下文预算（宿主上下文限制相关）
budget:
  max_input_tokens: 200000
  max_pre_critic_tokens: 60000
  critic_role_input_tokens: 15000
  judge_input_tokens: 25000

# 报告
report:
  top_findings_count: 5
  default_language: "zh"
  # 渲染通道：与 CLI 缺省一致（scripts/cli.ts 缺省 --format = html）
  #   零额外 LLM token：ReviewReport JSON → HTML（render-html.ts）→ 可选 PDF（render-pdf.py）
  render_default: "html"  # 规范声明；CLI 当前硬编码 html，如需改默认请同步 scripts/cli.ts
