# OpenReview 论文源配置

api:
  endpoint: "https://api.openreview.net"
  version: 2

# 关注的会议（用于找已进入评审流程的论文，可审真实 reviewer 意见）
venues:
  - "ICLR 2026"
  - "NeurIPS 2025"
  - "ICML 2025"
  - "IEEE S&P 2026"
  - "USENIX Security 2026"
  - "ISSTA 2026"

# 抓取内容
collect:
  papers: true              # 论文元数据 + 摘要
  reviews: true             # 已公开的 reviewer 评分与意见（真实红队对照）
  decisions: true           # accept/reject 决策

# 过滤
filter:
  status: ["submitted", "accepted"]
  min_rating: 3            # 仅关注评审均分 >= 3 的论文（有价值 + 争议大的都在这里）
  min_reviews: 3

# 用途说明
# 1. 拿真实 reviewer 意见对照本技能的 Reviewer Simulator 输出
# 2. 审"被拒论文"找共性死因 → 喂给 Research Miner 做研究空白
# 3. 审"被接受论文"找评审遗漏的 RVE → 鞭尸局素材
