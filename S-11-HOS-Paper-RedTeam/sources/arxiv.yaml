# arXiv 论文源配置

# 查询参数（对应 arXiv API: https://export.arxiv.org/api/query）
api:
  endpoint: "https://export.arxiv.org/api/query"
  sort_by: "submittedDate"
  sort_order: "descending"
  max_results: 100

# 默认查询
query:
  search_query: "cat:cs.CR AND (abs:LLM OR abs:agent) OR (cat:cs.SE AND abs:vulnerability)"
  start: 0

# 主题 → 查询词映射
topics:
  llm-security: "cat:cs.CR AND (abs:\"LLM\" OR abs:\"prompt injection\")"
  ai-agent: "cat:cs.AI OR cat:cs.MA AND abs:agent"
  sast: "cat:cs.SE AND (abs:\"static analysis\" OR abs:SAST)"
  vulnerability-detection: "cat:cs.CR AND (abs:vulnerability OR abs:SAST)"

# 过滤规则
filter:
  min_pages: 4          # 过滤过短的（可能是摘要型报告）
  exclude_preprint_only: false  # 是否排除纯预印本（默认保留，红队也要审预印本）
  date_range_days: 7    # 默认只看最近 7 天

# 输出字段（写入 database/paper.json）
fields:
  - arxiv_id
  - title
  - authors
  - published
  - updated
  - venue
  - journal_ref
  - abstract
  - categories
