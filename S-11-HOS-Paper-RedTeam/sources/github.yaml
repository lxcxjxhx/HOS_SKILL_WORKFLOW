# GitHub 论文源配置

api:
  endpoint: "https://api.github.com"
  per_page: 30

# 关注的仓库主题（用于：1. 找实现，2. 找论文对应代码，3. 审计仓库健康度）
queries:
  ai-sast: "topic:SAST topic:LLM"
  llm-vuln: "topic:llm topic:vulnerability-detection"
  agent-security: "topic:ai-agent topic:security"

# 仓库健康度审计（喂给 Paper Autopsy 的 RVE-REPRO / RVE-DATA）
health_check:
  # 判定"残废仓库"的阈值（命中任一即标 RVE-BENCH / RVE-REPRO）
  stale_days: 180          # 超过 180 天无提交
  min_stars: 20            # Star 少于 20
  min_open_prs: 0          # 有效 PR 极少
  archived: true           # 已归档

# 与论文的关联字段
link_paper:
  match_by:
    - repo_name           # 论文提到仓库名
    - repo_url            # 论文给链接
    - author_name         # 作者同名仓库
  output: "database/paper.json#repos"

# 用途说明
# 论文声称开源 → 拉下来审计代码是否真的对应论文描述
# 论文没开源 → 搜作者/机构同名仓库，确认"闭源"这个 RVE-REPRO 证据
