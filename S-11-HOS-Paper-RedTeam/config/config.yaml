# HOS-Paper-RedTeam 全局配置

# ===== 毒舌风格 =====
spiciness: 3            # 辣度 0-5：0=客观审稿, 1=温和, 2=直接, 3=毒舌(默认), 4=狠毒, 5=鞭尸(仅内部)
public_spiciness: 1     # 公开内容辣度上限（博客/周报用同行评审措辞）
attack_authors: false   # 禁止攻击作者（铁律，勿改 true）

# ===== 目标主题 =====
target_topics:
  - LLM Security
  - AI Agent Security
  - Cybersecurity
  - Software Engineering
  - Machine Learning Safety

# ===== 抓取 =====
sources:
  arxiv: "sources/arxiv.yaml"
  openreview: "sources/openreview.yaml"
  github: "sources/github.yaml"

# ===== 输出 =====
output_language: zh     # zh / en
output_dir: ./output
output_mode: scorecard  # scorecard(默认,评分卡置顶/长文可选) / full(评分卡+长文) / brief(仅评分+点评)
default_template: "templates/paper-autopsy.md"

# ===== 评分模型（详见 references/score-model.md）=====
scoring:
  dims: "universal"       # universal(通用六维,默认) / security(AI安全五维)
  deduction: { critical: 3.0, high: 2.0, medium: 1.0, low: 0.5 }
  show_percentile: true   # 显示"击败 X% 已审论文"，样本<5 时自动隐藏
  min_percentile_sample: 5

# ===== 评分卡渲染（ghfind 式，详见 references/ghfind-card.md）=====
renderer:
  cmd: "node src/index.ts <review.json>"   # TS 渲染器用法
  example: "src/example-review.json"

# ===== 方法论背书（详见 references/methodology.md）=====
methodology:
  reference: "references/methodology.md"       # 背书书单 + Operationalization 映射
  authoritative_sources: "references/authoritative-sources.md"  # 权威书评/解读来源库
  cite_backing: true                           # 输出标注 [背书: <方法论>]，不写「根据我们的经验」
  require_authoritative_evidence: true         # RVE/一句话点评/Reviewer 对照尽量挂权威佐证

# ===== 联网核验（权威佐证默认动作，对齐 S-12 Evidence-Agent 铁律）=====
# paper 对象必须尝试核验 arXiv/OpenReview/PWC/S2；已尝试仍无结果才允许写「查不到，证据缺口」
evidence_network:
  required: true
  sources:
    - arxiv_abs          # https://arxiv.org/abs/<id>：标题/版本/发表状态/代码链接
    - openreview         # 顶会真实审稿意见（与 Reviewer 模拟对照）
    - papers_with_code   # 复现记录/SOTA 排名
    - semantic_scholar   # 引用量/被引趋势
    - github_api         # 开源仓库健康度
  unverifiable_rule: "must_have_tried"   # 未尝试联网就标 unverifiable 属流程缺陷

# ===== RVE 编号 =====
rve_auto_assign: true   # 自动分配 HOS-RVE-YYYY-NNNN
rve_sequence_file: "database/vulnerability.json"

# ===== 工作流节奏 =====
schedule:
  daily: "workflows/daily-scan.yaml"
  weekly: "workflows/weekly-report.yaml"
  monthly: "workflows/monthly-report.yaml"
