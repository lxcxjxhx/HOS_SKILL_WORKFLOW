# 每月研究漏洞月报工作流（HOS-Paper-RedTeam）
# 说明：本文件是编排说明，供调度器/人工触发，不自行执行。

name: hos-paper-redteam-monthly
schedule: "0 10 1 * *"     # 每月 1 日 10:00
enabled: true

steps:
  - id: 1-monthly-agg
    agent: "09-research-miner"
    action: "聚合本月全部 RVE，生成分类分布 + 严重度占比 + 攻击模式频次"
    output: "月统计"

  - id: 2-trend
    agent: "09-research-miner"
    action: "对比上月：新增/关闭/升级的 RVE，攻击模式演化"
    output: "趋势分析"

  - id: 3-gap-pool
    agent: "09-research-miner"
    action: "研究机会池季度体检：星级>=4 的 GAP 排期建议"
    output: "机会池报告"

  - id: 4-monthly-report
    agent: "10-blogger-agent"
    action: "生成《HOS AI 研究漏洞月报》（对标安全行业月报）"
    output: "月报 1 篇"

  - id: 5-persist
    action: "归档到 output/monthly/YYYY-MM.md，更新 research-gap.json"
    output: "归档完成"

report_structure:
  - "本月概况：审 N 篇，RVE M 条，GAP K 个"
  - "漏洞分布：各分类雷达 + 严重度占比"
  - "TOP 攻击模式：本月学界/业界最常翻车的点"
  - "研究机会：机会池精选 + 投稿建议"
  - "下月展望：扫描主题调整建议"
